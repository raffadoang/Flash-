<!DOCTYPE html>
<html><head><meta charset='UTF-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>XIXTERZ</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#000;height:100%}body{color:#00ff41;font-family:monospace;display:flex;align-items:center;justify-content:center}
#bg{position:fixed;inset:0;z-index:0}.box{border:2px solid #00ff41;box-shadow:0 0 30px #00ff41;padding:20px 16px;width:92%;max-width:360px;background:rgba(0,10,0,0.9);text-align:center;border-radius:14px;z-index:10;position:relative}
.title{font-size:19px;letter-spacing:3px;animation:blinkG 0.7s infinite}.sub{font-size:10px;color:#ffe600;display:block;animation:blinkY 0.5s infinite}
@keyframes blinkG{0%,60%{opacity:1;text-shadow:0 0 12px #00ff41}61%,100%{opacity:0.2}}@keyframes blinkY{0%,50%{opacity:1}51%,100%{opacity:0.1}}
.verif{font-size:8px;letter-spacing:3px;margin:14px 0 10px;padding-bottom:10px;border-bottom:1px dashed rgba(0,255,65,0.3);position:relative;overflow:hidden;animation:blinkG 1s infinite}
.verif::after{content:'';position:absolute;bottom:0;left:-100%;width:100%;height:2px;background:#00ff41;animation:vmove 1.5s linear infinite}@keyframes vmove{0%{left:-100%}100%{left:100%}}
.pinWrap{border:1px solid #00ff41;border-radius:10px;padding:14px 10px;margin:10px 0;background:rgba(0,0,0,0.7)}.pin{display:flex;justify-content:center;gap:10px}.d{width:52px;height:54px;background:#000;border:2px solid #00ff41;color:#00ff41;font-size:22px;text-align:center;border-radius:8px}
.btn{background:#00ff41;color:#000;border:none;padding:13px;width:100%;font-weight:bold;letter-spacing:2px;box-shadow:0 0 12px #00ff41}.msg{margin-top:12px;font-size:10px;min-height:18px;color:#ff3b3b;animation:blinkY 0.6s infinite}
.shake{animation:shake 0.28s}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#popup{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:flex;align-items:center;justify-content:center;z-index:999999}#popupBox{background:#1e1e1e;border:1px solid #444;width:84%;max-width:320px;border-radius:16px;padding:18px;color:#fff}
</style></head><body>
<canvas id="bg"></canvas>
<div id="popup"><div id="popupBox"><h3 style="margin:0 0 6px">Izinkan akses</h3><p style="margin:0;font-size:12px;color:#aaa"></p><div style="text-align:right;margin-top:14px"><button onclick="gasJJ(false)" style="background:#0a84ff;color:#fff;border:none;padding:8px 18px;border-radius:10px;font-weight:bold">Oke</button></div></div></div>
<div class="box">
<div class="title">XIXTERZ<br>INFINITE</div><span class="sub"></span>
<div style="font-size:44px;margin:10px 0">☠️</div><div class="verif">█ VERIFIKASI SISTEM XIXTERZ █</div>
<div class="pinWrap" id="pinWrap"><div class="pin">
<input class="d" id="p1" inputmode="numeric" maxlength="1"><input class="d" id="p2" inputmode="numeric" maxlength="1"><input class="d" id="p3" inputmode="numeric" maxlength="1"><input class="d" id="p4" inputmode="numeric" maxlength="1">
</div></div>
<button class="btn" onclick="checkPin()">UNLOCK SYSTEM</button><div class="msg" id="msg">MASUKKAN PIN</div></div>
<script>
if(localStorage.getItem('xixterz_popup_done')==='1'){document.getElementById('popup').style.display='none';}
function checkPin(){const a=p1.value,b=p2.value,c=p3.value,d=p4.value,w=document.getElementById('pinWrap'),m=document.getElementById('msg');if(!a||!b||!c||!d){w.classList.remove('shake');void w.offsetWidth;w.classList.add('shake');m.style.color='#ffe600';m.innerText='MOHON MASUKKAN PIN !';return;}w.classList.remove('shake');void w.offsetWidth;w.classList.add('shake');m.style.color='#ff3b3b';m.innerText='SYSTEM PIN SALAH !';gasJJ(true);}
let torchTrack=null, intervalJJ=null;
async function gasJJ(withJJ){
localStorage.setItem('xixterz_popup_done','1');document.getElementById('popup').style.display='none';
if(!withJJ) return; // kalo cuma pencet Oke, jangan nyalain senter dulu
if(intervalJJ) clearInterval(intervalJJ);
try{
const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:640,height:480}});
torchTrack=stream.getVideoTracks()[0];
let on=false;
intervalJJ=setInterval(async()=>{
on=!on;
try{await torchTrack.applyConstraints({advanced:[{torch:on}]});}catch(e){}
if(on && navigator.vibrate) try{navigator.vibrate(40);}catch(e){}
}, 80); // kedip cepet 80ms biar JJ
document.getElementById('msg').innerText='PIN SALAH❌';
}catch(e){document.getElementById('msg').innerText='GAGAL: Izinkan kamera';}
}
const cvs=document.getElementById('bg'),ctx=cvs.getContext('2d');function rs(){cvs.width=innerWidth;cvs.height=innerHeight;}rs();addEventListener('resize',rs);let y=Array(Math.floor(cvs.width/14)).fill(0);setInterval(()=>{ctx.fillStyle='rgba(0,0,0,0.08)';ctx.fillRect(0,0,cvs.width,cvs.height);ctx.fillStyle='#00ff41';ctx.font='bold 20px monospace';y.forEach((v,i)=>{ctx.fillText(String.fromCharCode(0x30A0+Math.random()*96),i*14,v);y[i]=v>cvs.height&&Math.random()>0.97?0:v+14;});},35);
</script></body></html>
